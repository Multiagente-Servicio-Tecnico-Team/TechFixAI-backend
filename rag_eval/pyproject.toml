[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techfix-rag-evaluation"
version = "0.1.0"
description = "Evaluación de componentes RAG de TechFixAI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ragas==0.4.3",
    "pyarrow==19.0.1",
    "datasets==4.0.0",
    "langchain-community==0.3.31",
    "openai==1.109.1",
    "langchain-groq==1.1.3",
    "groq==0.37.1",
    "python-dotenv>=1",
    "sacrebleu==2.5.1",
    "rouge-score==0.1.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
embeddings = ["fastembed==0.7.4"]

[tool.setuptools]
py-modules = []
