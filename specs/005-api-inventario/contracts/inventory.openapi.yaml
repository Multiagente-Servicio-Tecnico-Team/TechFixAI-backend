openapi: 3.1.0
info:
  title: TechFix.AI Inventory API
  version: 1.0.0
  description: CRUD de repuestos para personal ADMIN y TECHNICIAN autenticado.
servers:
  - url: http://localhost:8000
    description: Backend local
paths:
  /api/inventory/parts:
    get:
      operationId: listInventoryParts
      summary: Listar repuestos activos
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Catálogo activo para filtrar y paginar en el frontend.
          content:
            application/json:
              schema:
                type: object
                required: [parts]
                properties:
                  parts:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryPart'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createInventoryPart
      summary: Registrar repuesto
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPartWrite'
      responses:
        '201':
          description: Repuesto creado activo.
          content:
            application/json:
              schema:
                type: object
                required: [part]
                properties:
                  part:
                    $ref: '#/components/schemas/InventoryPart'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/inventory/parts/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Código SKU del repuesto.
        schema:
          type: string
          minLength: 1
          maxLength: 50
    put:
      operationId: replaceInventoryPart
      summary: Actualizar datos y existencias
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPartWrite'
      responses:
        '200':
          description: Repuesto actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [part]
                properties:
                  part:
                    $ref: '#/components/schemas/InventoryPart'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteInventoryPart
      summary: Eliminar repuesto no citado
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Repuesto eliminado.
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/inventory/categories:
    get:
      operationId: listInventoryCategories
      summary: Consultar categorías activas distintas
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Valores exactos del catálogo, sin traducción.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: techfix_session
  schemas:
    InventoryPartWrite:
      type: object
      additionalProperties: false
      required: [code, name, category, unit_price, current_stock, minimum_threshold]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        name:
          type: string
          minLength: 3
          maxLength: 150
        category:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: [string, 'null']
        unit_price:
          type: string
          pattern: '^(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,7}\.[0-9]{2})$'
          description: Importe PEN positivo con dos posiciones decimales.
          example: '114.75'
        current_stock:
          type: integer
          minimum: 0
          maximum: 999999
        minimum_threshold:
          type: integer
          minimum: 0
          maximum: 999999
    InventoryPart:
      type: object
      required: [id, code, name, category, description, unit_price, current_stock, minimum_threshold, active, created_at, updated_at]
      properties:
        id:
          type: integer
          minimum: 1
          description: Identificador numérico estable de spare_parts.id; se usa para relaciones entre módulos.
        code:
          type: string
        name:
          type: string
        category:
          type: [string, 'null']
        description:
          type: [string, 'null']
        unit_price:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        current_stock:
          type: integer
        minimum_threshold:
          type: integer
        active:
          type: boolean
          const: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [detail, code]
      properties:
        detail:
          type: string
        code:
          type: string
        field:
          type: [string, 'null']
  responses:
    SessionRequired:
      description: Falta una sesión válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StaffOnly:
      description: La sesión no pertenece al personal del taller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No existe un repuesto con ese código.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Código duplicado o repuesto referenciado por presupuesto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Invalid:
      description: El cuerpo incumple las reglas de validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Persistencia de inventario no disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
