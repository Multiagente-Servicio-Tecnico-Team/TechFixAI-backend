openapi: 3.1.0
info:
  title: TechFix.AI Supplier Purchases API
  version: 1.0.0
  description: Registro interno de comprobantes de compras, proveedores y recepciones. Todas las rutas requieren sesión ADMIN.
servers:
  - url: http://localhost:8000
security:
  - sessionCookie: []
paths:
  /api/admin/suppliers:
    get:
      operationId: listSuppliers
      summary: Listar proveedores
      parameters:
        - in: query
          name: active
          schema: {type: boolean}
        - in: query
          name: search
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200':
          description: Proveedores paginados.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Supplier'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createSupplier
      summary: Crear proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierWrite'}
      responses:
        '201':
          description: Proveedor creado.
          content:
            application/json:
              schema:
                type: object
                required: [supplier]
                properties: {supplier: {$ref: '#/components/schemas/Supplier'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/admin/suppliers/{supplier_id}:
    parameters:
      - in: path
        name: supplier_id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getSupplier
      summary: Consultar un proveedor, activo o inactivo
      responses:
        '200':
          description: Proveedor encontrado.
          content:
            application/json:
              schema:
                type: object
                required: [supplier]
                properties: {supplier: {$ref: '#/components/schemas/Supplier'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateSupplier
      summary: Actualizar o desactivar proveedor sin borrar su historial
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierPatch'}
      responses:
        '200':
          description: Proveedor actualizado.
          content:
            application/json:
              schema:
                type: object
                properties: {supplier: {$ref: '#/components/schemas/Supplier'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/admin/purchases:
    get:
      operationId: listSupplierPurchases
      summary: Consultar compras con filtros y paginación
      parameters:
        - in: query
          name: supplier_id
          schema: {type: integer, minimum: 1}
        - in: query
          name: from_date
          schema: {type: string, format: date}
        - in: query
          name: to_date
          schema: {type: string, format: date}
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/PurchaseStatus'}
        - in: query
          name: payment_status
          schema: {$ref: '#/components/schemas/PaymentStatus'}
        - in: query
          name: document_number
          schema: {type: string, maxLength: 40}
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PurchaseSummary'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
    post:
      operationId: createSupplierPurchase
      summary: Registrar comprobante recibido, sin modificar stock
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseWrite'}
      responses:
        '201':
          description: Compra registrada.
          content:
            application/json:
              schema:
                type: object
                properties: {purchase: {$ref: '#/components/schemas/Purchase'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/admin/purchases/{purchase_id}:
    parameters:
      - in: path
        name: purchase_id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getSupplierPurchase
      summary: Consultar compra, líneas, recepciones e historial
      responses:
        '200':
          description: Detalle de compra.
          content:
            application/json:
              schema:
                type: object
                properties: {purchase: {$ref: '#/components/schemas/Purchase'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateSupplierPurchase
      summary: Actualizar datos permitidos de una compra no recibida
      description: No permite modificar snapshots del comprobante ni líneas luego de una recepción; payment_status sólo puede avanzar de PENDING a PAID.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchasePatch'}
      responses:
        '200':
          description: Compra actualizada.
          content:
            application/json:
              schema:
                type: object
                properties: {purchase: {$ref: '#/components/schemas/Purchase'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /api/admin/purchases/{purchase_id}/cancel:
    post:
      operationId: cancelSupplierPurchase
      summary: Cancelar compra aún no recibida
      responses:
        '200': {description: Compra cancelada y cambio auditado.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/admin/purchases/{purchase_id}/receipts:
    post:
      operationId: receiveSupplierPurchase
      summary: Confirmar cantidades recibidas y aplicar stock una vez
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiptWrite'}
      responses:
        '201':
          description: Recepción aplicada atómicamente.
          content:
            application/json:
              schema: {type: object, properties: {receipt: {$ref: '#/components/schemas/Receipt'}}}
        '200':
          description: Reintento idéntico; se devuelve la recepción previamente aplicada.
          headers:
            Idempotent-Replayed: {schema: {type: boolean}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: listPurchaseReceipts
      summary: Listar recepciones confirmadas de una compra
      responses:
        '200': {description: Recepciones con cantidades y responsables.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: techfix_session}
  parameters:
    limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    offset:
      in: query
      name: offset
      schema: {type: integer, minimum: 0, default: 0}
  schemas:
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,11})\.[0-9]{2}$'
      examples: ['125.50']
    PurchaseStatus:
      type: string
      enum: [REGISTERED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, PAID]
    Supplier:
      type: object
      required: [id, name, active]
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 200}
        tax_id: {type: [string, 'null'], maxLength: 20}
        contact_name: {type: [string, 'null'], maxLength: 200}
        contact_email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 30}
        address: {type: [string, 'null']}
        delivery_lead_days: {type: [integer, 'null'], minimum: 0}
        active: {type: boolean}
    SupplierWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        tax_id: {type: [string, 'null'], maxLength: 20}
        contact_name: {type: [string, 'null'], maxLength: 200}
        contact_email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 30}
        address: {type: [string, 'null']}
        delivery_lead_days: {type: [integer, 'null'], minimum: 0}
    SupplierPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        tax_id: {type: [string, 'null'], maxLength: 20}
        contact_name: {type: [string, 'null'], maxLength: 200}
        contact_email: {type: [string, 'null'], format: email}
        phone: {type: [string, 'null'], maxLength: 30}
        address: {type: [string, 'null']}
        delivery_lead_days: {type: [integer, 'null'], minimum: 0}
        active: {type: boolean}
    PurchaseLineWrite:
      type: object
      additionalProperties: false
      required: [description, quantity, unit_cost]
      properties:
        spare_part_id: {type: [integer, 'null'], minimum: 1}
        description: {type: string, minLength: 1, maxLength: 300}
        quantity: {type: number, exclusiveMinimum: 0}
        unit_cost: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
    PurchaseWrite:
      type: object
      additionalProperties: false
      required: [supplier_id, document_type, document_number, issue_date, payment_method, payment_status, items]
      properties:
        supplier_id: {type: integer, minimum: 1}
        purchase_order_id: {type: [integer, 'null'], minimum: 1}
        document_type: {type: string, minLength: 1, maxLength: 30}
        document_series: {type: [string, 'null'], maxLength: 30}
        document_number: {type: string, minLength: 1, maxLength: 40}
        issue_date: {type: string, format: date}
        due_date: {type: [string, 'null'], format: date}
        payment_method: {type: string, enum: [TRANSFER, CASH, CARD, OTHER]}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        other_charges: {$ref: '#/components/schemas/Money'}
        notes: {type: [string, 'null']}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PurchaseLineWrite'}
    PurchasePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        notes: {type: [string, 'null']}
    PurchaseSummary:
      type: object
      properties:
        id: {type: integer}
        supplier_id: {type: integer}
        supplier_name: {type: string}
        document_type: {type: string}
        document_number: {type: string}
        issue_date: {type: string, format: date}
        total_amount: {$ref: '#/components/schemas/Money'}
        status: {$ref: '#/components/schemas/PurchaseStatus'}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
    PurchaseLine:
      type: object
      properties:
        id: {type: integer}
        spare_part_id: {type: [integer, 'null']}
        code_snapshot: {type: [string, 'null'], maxLength: 50}
        description: {type: string, maxLength: 300}
        quantity: {type: string}
        unit_cost: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        line_total: {$ref: '#/components/schemas/Money'}
    Purchase:
      allOf:
        - {$ref: '#/components/schemas/PurchaseSummary'}
        - type: object
          properties:
            payment_method: {type: string, enum: [TRANSFER, CASH, CARD, OTHER]}
            currency: {type: string, const: PEN}
            supplier_tax_id: {type: [string, 'null']}
            purchase_order_id: {type: [integer, 'null']}
            due_date: {type: [string, 'null'], format: date}
            subtotal: {$ref: '#/components/schemas/Money'}
            tax_total: {$ref: '#/components/schemas/Money'}
            discount_total: {$ref: '#/components/schemas/Money'}
            other_charges: {$ref: '#/components/schemas/Money'}
            responsible_name: {type: string}
            created_by: {type: integer}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            notes: {type: [string, 'null']}
            items: {type: array, items: {$ref: '#/components/schemas/PurchaseLine'}}
            receipts: {type: array, items: {$ref: '#/components/schemas/Receipt'}}
            audit_events: {type: array, items: {type: object}}
    ReceiptWrite:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        notes: {type: [string, 'null']}
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purchase_item_id, quantity_received]
            properties:
              purchase_item_id: {type: integer, minimum: 1}
              quantity_received: {type: number, exclusiveMinimum: 0}
    Receipt:
      type: object
      properties:
        id: {type: integer}
        purchase_id: {type: integer}
        received_at: {type: string, format: date-time}
        received_by: {type: integer}
        items: {type: array, items: {type: object}}
    Error:
      type: object
      properties:
        detail: {type: string}
        code: {type: string}
        field: {type: [string, 'null']}
  responses:
    Unauthorized:
      description: Sesión ausente o vencida.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Se requiere rol ADMIN.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Recurso inexistente.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Duplicado, transición inválida o clave de idempotencia reutilizada con otro payload.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: Datos inválidos o importes inconsistentes.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Persistencia temporalmente no disponible; la transacción no se aplicó parcialmente.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
